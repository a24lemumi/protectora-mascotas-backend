services:
  # Servicio web PHP
  - type: web
    name: protectora-mascotas-backend
    env: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: protectora-db
          property: connectionString
    buildCommand: |
      composer install --no-dev --optimize-autoloader
    startCommand: |
      php -S 0.0.0.0:8080 -t public
    routes:
      - type: rewrite
        source: /*
    buildFilter:
      paths:
        - '**/*'
  
  # Base de datos PostgreSQL gestionada
  - type: psql
    name: protectora-db
    plan: starter
    version: 16
